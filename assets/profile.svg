<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .terminal-bg { fill: #fbfdff; }
            .terminal-border { fill: none; stroke: #93b4d1; stroke-width: 2; rx: 12; }
            .panel-border { fill: none; stroke: #c2d6e8; stroke-width: 2; rx: 12; }
            .panel-bg { fill: #f4f8fc; }
            
            .dot-red { fill: #ff5f56; }
            .dot-yellow { fill: #ffbd2e; }
            .dot-green { fill: #27c93f; }
            
            .text-main { font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace; font-size: 14px; fill: #475569; }
            .text-title { fill: #8ba2b8; font-size: 14px; font-weight: bold; }
            .text-key { fill: #0284c7; font-weight: bold; }
            .text-val { fill: #334155; }
            .text-section { fill: #0ea5e9; font-weight: bold; }
            .text-divider { fill: #94a3b8; letter-spacing: 2px; }
            .text-header { fill: #6366f1; font-weight: bold; font-size: 16px; }
            
            .ascii { font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace; fill: #6094ea; font-size: 8px; font-weight: 500; white-space: pre; letter-spacing: 1px; }
            
            .scan-dot { fill: #ef4444; }
            .scan-text { fill: #ef4444; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
            
            .highlight-bg { fill: #e0f2fe; rx: 4; }
        </style>
    </defs>

    <!-- Outer shadow simulation (bottom thick border) -->
    <rect x="20" y="60" width="1360" height="730" fill="#cbd5e1" rx="12"/>

    <!-- Terminal Window Background -->
    <rect x="20" y="60" width="1360" height="720" class="terminal-bg" rx="12"/>
    <rect x="20" y="60" width="1360" height="720" class="terminal-border"/>
    
    <!-- Top Bar -->
    <circle cx="50" cy="90" r="7" class="dot-red"/>
    <circle cx="75" cy="90" r="7" class="dot-yellow"/>
    <circle cx="100" cy="90" r="7" class="dot-green"/>
    
    <text x="700" y="95" class="text-main text-title" text-anchor="middle">soumyar78@dev ~ % ./profile.sh --live</text>
    
    <circle cx="1270" cy="92" r="5" class="scan-dot"/>
    <text x="1285" y="96" class="text-main scan-text">SCANNING</text>

